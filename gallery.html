<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Yardley Muslim Centre</title>
  <meta name="description" content="View photos of the spaces and facilities at Yardley Muslim Centre in Yardley, Birmingham.">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/main/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/main/favicon-32x32.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="navbar"></nav>
  <section class="page-header">
    <div class="container">
      <h1>Gallery</h1>
      <p>A look around Yardley Muslim Centre</p>
    </div>
  </section>
  <main>
    <section class="section">
      <div class="container">
        <p class="gallery-intro">Explore the building and some of the spaces visitors use. Select a photo to view it larger.</p>
        <div class="gallery-grid">
          <article class="gallery-card"><button class="gallery-image-button" type="button" data-gallery-open data-full="/assets/images/entrance-close_up.JPG" data-caption="Entrance and shoe storage area at Yardley Muslim Centre" aria-label="View the entrance and shoe storage area"><img src="/assets/images/entrance-close_up.JPG" alt="Entrance and shoe storage area at Yardley Muslim Centre" loading="eager" decoding="async"></button><p class="gallery-caption">Entrance and shoe storage</p></article>
          <article class="gallery-card"><button class="gallery-image-button" type="button" data-gallery-open data-full="/assets/images/mens_front-day.JPG" data-caption="Men's hall at YMC in daylight" aria-label="View the men's hall in daylight"><img src="/assets/images/mens_front-day.JPG" alt="Men's hall at YMC in daylight" loading="lazy" decoding="async"></button><p class="gallery-caption">Men's hall by day</p></article>
          <article class="gallery-card"><button class="gallery-image-button" type="button" data-gallery-open data-full="/assets/images/car_park-wide.JPG" data-caption="The car park and grounds at Yardley Muslim Centre" aria-label="View the centre car park and grounds"><img src="/assets/images/car_park-wide.JPG" alt="Car park and grounds at Yardley Muslim Centre" loading="lazy" decoding="async"></button><p class="gallery-caption">Grounds and parking</p></article>
          <article class="gallery-card"><button class="gallery-image-button" type="button" data-gallery-open data-full="/assets/images/mens_back-day.JPG" data-caption="Rear of the men's hall at YMC in daylight" aria-label="View the rear of the men's hall"><img src="/assets/images/mens_back-day.JPG" alt="Rear of the men's hall at YMC in daylight" loading="lazy" decoding="async"></button><p class="gallery-caption">Rear of the hall</p></article>
          <article class="gallery-card"><button class="gallery-image-button" type="button" data-gallery-open data-full="/assets/images/rear_park.JPG" data-caption="Rear car park at YMC" aria-label="View the rear car park at YMC"><img src="/assets/images/rear_park.JPG" alt="Rear car park at YMC" loading="lazy" decoding="async"></button><p class="gallery-caption">Rear car park</p></article>
          <article class="gallery-card"><button class="gallery-image-button" type="button" data-gallery-open data-full="/assets/images/mens_front-night.JPG" data-caption="Men's hall at YMC at night" aria-label="View the men's hall at night"><img src="/assets/images/mens_front-night.JPG" alt="Men's hall at YMC at night" loading="lazy" decoding="async"></button><p class="gallery-caption">Men's hall at night</p></article>
          <article class="gallery-card"><button class="gallery-image-button" type="button" data-gallery-open data-full="/assets/images/mimbar-night.JPG" data-caption="The mimbar inside YMC" aria-label="View the mimbar inside YMC"><img src="/assets/images/mimbar-night.JPG" alt="Mimbar inside Yardley Muslim Centre" loading="lazy" decoding="async"></button><p class="gallery-caption">Mimbar</p></article>
          <article class="gallery-card"><button class="gallery-image-button" type="button" data-gallery-open data-full="/assets/images/mens-full.JPG" data-caption="Men's hall at YMC" aria-label="View the men's hall at YMC"><img src="/assets/images/mens-full.JPG" alt="Men's hall at YMC" loading="lazy" decoding="async"></button><p class="gallery-caption">Men's hall</p></article>
        </div>
      </div>
    </section>
  </main>
  <dialog class="gallery-lightbox" aria-label="Enlarged gallery photo">
    <button class="gallery-lightbox-close" type="button" data-gallery-close>Close <span aria-hidden="true">×</span></button>
    <figure><img data-gallery-large alt=""><figcaption data-gallery-caption></figcaption></figure>
  </dialog>
  <footer class="footer"></footer>
  <script src="/script.js"></script>
  <script src="/gallery.js"></script>
</body>
</html>
